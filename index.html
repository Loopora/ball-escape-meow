<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b18"><title>Ball Escape Meow · TikTok Edition</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><h1>🐱 BALL ESCAPE <span>MEOW</span></h1><p>HOW MANY BALLS CAN YOU GET?</p></header><div class="stage" id="stage"><canvas id="game"></canvas><div class="stats"><div><small>⚡ BALLS</small><strong id="count">1</strong></div><div class="right"><small>💥 ESCAPES</small><strong id="escapes">0</strong></div></div><div id="toast" class="toast">+2 BALLS!</div><div class="stage-controls"><button id="stageToggle">⏸ Pause</button><button id="fullscreen">⛶ Fullscreen</button></div><div class="stage-footer">WAIT FOR THE NEXT ESCAPE... 👀</div></div><div class="buttons"><button id="enableSound">🔊 ENABLE MEOW</button><button id="reset" class="secondary">↻ Restart</button></div><div class="sound-status" id="soundStatus">Click ENABLE MEOW once to unlock sound</div><section class="settings"><label>Speed <output id="speedOut">1.0×</output><input id="speed" type="range" min="0.5" max="2.5" step="0.1" value="1"></label><label>Gap size <output id="gapOut">30°</output><input id="gap" type="range" min="15" max="65" step="5" value="30"></label><label>Rotation <output id="rotationOut">0.75×</output><input id="rotation" type="range" min="0" max="2" step="0.05" value="0.75"></label><label>Ball limit <output id="limitOut">256</output><input id="limit" type="range" min="32" max="512" step="32" value="256"></label><label class="check"><input id="sound" type="checkbox" checked> 🐱 Meow on EVERY escape</label></section><p class="note">For TikTok: enable sound, tap fullscreen, then record your screen. Pause and fullscreen controls remain visible.</p></main><script src="script.js"></script></body></html>
